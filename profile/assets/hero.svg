<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02251B"/>
      <stop offset="0.55" stop-color="#084A36"/>
      <stop offset="1" stop-color="#0E7A57"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE3B8"/>
      <stop offset="1" stop-color="#2FBF8B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045">
    <path d="M0 105H1200"/><path d="M0 210H1200"/><path d="M0 315H1200"/>
    <path d="M150 0V420"/><path d="M300 0V420"/><path d="M450 0V420"/><path d="M600 0V420"/>
    <path d="M750 0V420"/><path d="M900 0V420"/><path d="M1050 0V420"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#7BE3B8" letter-spacing="4">GRADSTACK</text>

  <!-- headline -->
  <text x="78" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">The resume era is over.</text>
  <text x="78" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="33" font-weight="600" fill="#BFE9D8">Australia's AI workforce starts here.</text>

  <text x="80" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9CCDBB">Verified, capability-led Digital Human Profiles&#8482; &#8212; matched in real time</text>
  <text x="80" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9CCDBB">to the roles where people perform and thrive.</text>

  <!-- pill -->
  <g transform="translate(80, 340)">
    <rect width="300" height="42" rx="21" fill="url(#mint)"/>
    <text x="150" y="27" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#03251C">Get early access &#183; gradstack.ai</text>
  </g>

  <!-- DHP profile card -->
  <g transform="translate(830, 74)">
    <rect width="292" height="272" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#7BE3B8" stroke-opacity="0.45"/>
    <!-- avatar -->
    <circle cx="46" cy="52" r="22" fill="url(#mint)"/>
    <text x="46" y="59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#03251C">AT</text>
    <text x="82" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Alex T.</text>
    <text x="82" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9CCDBB">Digital Human Profile #4920</text>

    <!-- VEI gauge -->
    <g transform="translate(146, 158)">
      <circle r="52" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="9" fill="none"/>
      <path d="M 0 -52 A 52 52 0 1 1 -49.4 -16.1" stroke="url(#mint)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">VEI&#8482;</text>
      <text x="0" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9CCDBB">verified score</text>
    </g>

    <text x="146" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7BE3B8">Above benchmark &#183; Top 28% of cohort</text>
    <text x="146" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9CCDBB">6 Areas Verified</text>
  </g>
</svg>
